<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Curation feature map</title>
<style>
:root{
  --ink:#1f2937;--muted:#5b6472;--faint:#6b7280;--rule:#e5e7eb;--paper:#f7f7f4;
  --root:#1f2937;--howto:#4c6a92;--what:#2f7d78;--pipeline:#2e6f95;--browser:#a65d57;--tools:#6e7d3a;
  --read:#4e8b62;--ai:#4a63a8;--collection:#9a6226;--optional:#8a5a9e;--warn:#b4533f;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 "Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:#fff}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-direction:column;margin-right:6px}
.brand h1{margin:0;font-size:19px;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12.5px}
.search{position:relative;display:flex;align-items:center;gap:8px}
.search input{width:250px;padding:8px 12px 8px 32px;border:1px solid var(--rule);border-radius:10px;font:inherit;background:#fafafa;outline:none;transition:.15s}
.search input:focus{background:#fff;border-color:#c7d2fe;box-shadow:0 0 0 3px #eef2ff}
.search::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-52%);color:var(--faint);font-size:16px}
#count{font-size:12.5px;color:var(--muted);min-width:64px}
.btn{padding:7px 12px;border:1px solid var(--rule);border-radius:10px;background:#fff;color:#374151;font:inherit;font-size:13.5px;cursor:pointer;transition:.15s}
.btn:hover{background:#f3f4f6}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.legend small{color:var(--muted);font-size:12px;margin-right:2px}
.chip{font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer;color:color-mix(in srgb,var(--c) 85%,#111827);background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 24%,#fff)}
.chip:hover{background:color-mix(in srgb,var(--c) 18%,#fff)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);height:calc(100vh - 69px)}
#tree{overflow:auto;padding:24px 28px 120px;background-color:var(--paper);background-image:radial-gradient(#e4e4df 1px,transparent 1px);background-size:18px 18px}
.tree ul{position:relative;display:flex;flex-direction:column;gap:9px;margin:0;padding:0 0 0 36px;list-style:none}
.tree>ul{padding-left:0}
.tree li{position:relative;display:flex;align-items:flex-start;margin:0}
.tree li::before{content:"";position:absolute;left:-18px;top:18px;width:18px;border-top:1.5px solid var(--lc,#d1d5db)}
.tree li::after{content:"";position:absolute;left:-18px;top:-5px;bottom:-5px;border-left:1.5px solid var(--lc,#d1d5db)}
.tree li:first-child::after{top:18px}.tree li:last-child::after{bottom:auto;height:23px}.tree li:only-child::after{display:none}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.tree li>ul{padding-top:0}
.tree li>ul::before{content:"";position:absolute;left:0;top:18px;width:18px;border-top:1.5px solid var(--lc,#d1d5db)}
.node{display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 6px;border-radius:9px;background:#fff;color:var(--ink);
  border:1px solid color-mix(in srgb,var(--c) 28%,#e5e7eb);border-left:4px solid var(--c);
  cursor:pointer;user-select:none;white-space:nowrap;transition:background .15s,box-shadow .15s;box-shadow:0 1px 2px rgba(17,24,39,.05);outline:none}
.node:hover{background:color-mix(in srgb,var(--c) 7%,#fff);box-shadow:0 3px 10px rgba(17,24,39,.08)}
.node:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,#fff)}
.node.dashed{border-style:dashed;border-left-style:solid}
.node.branch{background:color-mix(in srgb,var(--c) 9%,#fff);font-weight:600;color:color-mix(in srgb,var(--c) 72%,#111827)}
.node.root{background:var(--root);color:#fff;border-color:var(--root);font-weight:600;padding:8px 15px 8px 8px;border-radius:11px}
.node.sel{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 4px 14px color-mix(in srgb,var(--c) 35%,transparent)}
.node.hit{box-shadow:0 0 0 3px #fde68a}
.node.hit.cur{box-shadow:0 0 0 3px #f59e0b}
.tog{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;color:var(--c);font-size:14px;transition:transform .15s,background .15s}
.tog:hover{background:color-mix(in srgb,var(--c) 14%,#fff)}
li:not(.closed)>.node>.tog.has{transform:rotate(90deg)}
.node.root .tog,.node.sel .tog{color:#fff}
.dot{width:20px;display:inline-flex;justify-content:center}.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);opacity:.75}
.node.sel .dot::before{background:#fff}
.badge{font-size:11px;font-weight:500;min-width:20px;text-align:center;padding:1px 6px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff)}
.node.root .badge,.node.sel .badge{color:#fff;background:rgba(255,255,255,.22)}
.tag{font-size:11px;font-weight:500;padding:1px 7px;border-radius:6px;color:#4b5563;background:#fff;border:1px solid #d9dee5}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,#fff);background:color-mix(in srgb,var(--warn) 7%,#fff)}
.node.sel .tag{color:#fff;border-color:rgba(255,255,255,.45);background:transparent}
.same{font-size:12px;color:var(--c);opacity:.8}.node.sel .same{color:#fff}
li.closed>ul{display:none}
aside{position:relative;overflow:auto;padding:24px 24px 40px;border-left:1px solid var(--rule);background:#fff;overflow-wrap:anywhere}
aside::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c,#1f2937)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px}
.crumb a{color:var(--muted);cursor:pointer;text-decoration:none}.crumb a:hover{color:var(--ink);text-decoration:underline}
aside h2{margin:0 0 10px;font-size:19px;letter-spacing:-.01em}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.fact{font-size:12.5px;padding:5px 9px;border-radius:8px;background:color-mix(in srgb,var(--c) 8%,#fff);border:1px solid color-mix(in srgb,var(--c) 18%,#fff)}
.fact b{color:var(--muted);font-weight:500;margin-right:5px}
aside p{margin:0 0 16px;color:#374151}
.sec{margin:0 0 14px}.sec h3{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 6px}
.sec .val{font-size:13.5px}
code{font:12.5px/1.5 Menlo,monospace;background:#f3f4f6;border-radius:6px;padding:2px 6px}
.run{display:flex;align-items:flex-start;gap:8px}.run code{flex:1;min-width:0;padding:8px 10px;white-space:pre;overflow-x:auto;display:block}
.copy{font-size:12px;padding:5px 9px;border-radius:8px;border:1px solid var(--rule);background:#fff;cursor:pointer}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills a{font-size:13px;padding:4px 10px;border-radius:999px;cursor:pointer;color:color-mix(in srgb,var(--c) 80%,#111827);background:color-mix(in srgb,var(--c) 9%,#fff);border:1px solid color-mix(in srgb,var(--c) 20%,#fff);transition:.15s}
.pills a:hover{background:color-mix(in srgb,var(--c) 18%,#fff)}
details{margin-top:6px;border-top:1px solid var(--rule);padding-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;margin:10px 0 0;font-size:12.5px}
dt{color:var(--muted);white-space:nowrap}dd{margin:0}
.help{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}
@media(max-width:900px){main{grid-template-columns:1fr;height:auto}aside{border-left:0;border-top:1px solid var(--rule)}.legend{margin-left:0}}
</style></head><body>
<header>
<div class="brand"><h1>Paper Curation feature map</h1><small>Select a node to expand it and view its description on the right</small></div>
<label class="search"><input id="q" placeholder="Search features (for example: review, BM25, deploy)" aria-label="Search features (for example: review, BM25, deploy)"><span id="count"></span></label>
<button class="btn" id="open">Expand all</button><button class="btn" id="close">Collapse all</button>
<div class="legend"><small>Shortcuts</small>
<button class="chip" style="--c:var(--howto)" data-go="How to use it">How to use it</button>
<button class="chip" style="--c:var(--read)" data-go="Read · browse and export">Read</button>
<button class="chip" style="--c:var(--ai)" data-go="AI · paper AI">AI</button>
<button class="chip" style="--c:var(--collection)" data-go="Collection · collection management">Collection</button>
<button class="chip" style="--c:var(--optional)" data-go="Optional features">Optional</button>
<button class="chip" style="--c:var(--pipeline)" data-go="How full curation runs">How full curation runs</button>
<a class="btn" href="feature-map.html">Korean</a>
</div>
</header>
<main><section id="tree" class="tree" role="tree" aria-label="Feature tree"></section><aside id="panel" aria-live="polite"></aside></main>
<script>
const TREE = {"label": "Paper Curation", "desc": "A system that turns Zotero papers into structured reviews, classification, connections, search, and timelines. It answers three questions: how to use it, what it can do, and how full curation runs.", "kind": "root", "children": [{"label": "How to use it", "desc": "Three entry points and the shared runner used by every capability.", "kind": "group", "tone": "howto", "children": [{"label": "Paper Curio (Zotero right-click)", "desc": "A Zotero 9/10 plugin. Right-click a paper to create a review, run feature modules, AI Chat, or Citedby.", "kind": "stage", "facts": [["Install", "paper-curio-zotero9.xpi or zotero10.xpi for the matching Zotero version"]]}, {"label": "Command line: run_feature.py", "desc": "Plan → confirm → execute one capability.", "kind": "stage", "run": "python pipeline/run_feature.py --list"}, {"label": "Full curation: run_full.py", "desc": "An advanced path that processes a whole collection in order.", "kind": "stage", "run": "python pipeline/run_full.py --topic <topic> --mode curate --dry-run"}, {"label": "Plan → confirm → execute", "desc": "Every capability passes through the same safeguards.", "kind": "stage", "children": [{"label": "Plan", "desc": "Before execution, show requirements, transmission destination, and cost. It writes nothing.", "kind": "stage"}, {"label": "Confirm", "desc": "Approve the plan. Synchronization, publishing, and email require explicit confirmation.", "kind": "stage"}, {"label": "Execute", "desc": "Use corpus reservation and registration locks, cost caps, preserve partial results on failure, and never automatically send work to another provider.", "kind": "stage"}, {"label": "Credentials", "desc": "Look up environment variables, then the OS keyring (credential:<provider>). Never store keys in plaintext settings files.", "kind": "stage"}]}]}, {"label": "What it can do", "desc": "On-demand capabilities, in-browser capabilities, and separate tools.", "kind": "group", "tone": "what", "children": [{"label": "Read · browse and export", "desc": "Browse and export generated results without an API key.", "kind": "read", "tone": "read", "children": [{"label": "Local PDF extraction", "desc": "Extract text and figures from a local PDF: OpenDataLoader for text (PyMuPDF with a warning when unavailable) and PyMuPDF geometric crops for figures.", "kind": "feature", "key": "feature:extract", "tags": [{"t": "Local", "level": "plain"}], "facts": [["Key", "No key required"], ["Cost", "Local · no cost"], ["External transmission", "None"]], "produces": "text.md · figures/", "same": [{"key": "step:extract", "label": "Full curation › Review › Extract text and figures"}], "tech": [["Feature ID", "extract"], ["Module", "run_update_force"], ["Provider", "None"], ["Runtime", "python3.12, PyMuPDF"]], "run": "# req.json = {\"schema_version\":1,\"feature\":\"extract\",\"params\":{…}}\npython pipeline/run_feature.py --request req.json            # plan\npython pipeline/run_feature.py --request req.json --execute  # execute"}, {"label": "Public institution table export", "desc": "Export a publishable institution table.", "kind": "feature", "key": "feature:institution-export", "tags": [{"t": "Local", "level": "plain"}], "facts": [["Key", "No key required"], ["Cost", "Local · no cost"], ["External transmission", "None; source redistribution terms remain applicable"]], "produces": "Publishable institution table (xlsx)", "tech": [["Feature ID", "institution-export"], ["Module", "export_institutions_public"], ["Provider", "None"], ["Runtime", "python3.12, openpyxl"]], "run": "# req.json = {\"schema_version\":1,\"feature\":\"institution-export\",\"params\":{…}}\npython pipeline/run_feature.py --request req.json            # plan\npython pipeline/run_feature.py --request req.json --execute  # execute"}]}, {"label": "AI · paper AI", "desc": "Process one or more papers with one selected provider.", "kind": "ai", "tone": "ai", "children": [{"label": "Paper review", "desc": "Extract text and figures from a PDF, then have the selected provider write a six-section Korean review (Essence, Motivation, Achievement, How, Originality, Evaluation).", "kind": "feature", "key": "feature:review", "tags": [{"t": "Paid", "level": "warn"}, {"t": "External transmission", "level": "plain"}], "facts": [["Key", "Key required"], ["Cost", "Paid API"], ["External transmission", "Selected cloud provider"]], "produces": "review.md · index.html · bibliography.json", "same": [{"key": "step:structured-review", "label": "Full curation › Review › Structured review"}], "tech": [["Feature ID", "review"], ["Module", "local_review"], ["Provider", "anthropic, openai, google"], ["Runtime", "python3.12, PyMuPDF, selected provider SDK"]], "run": "# req.json = {\"schema_version\":1,\"feature\":\"review\",\"params\":{…}}\npython pipeline/run_feature.py --request req.json            # plan\npython pipeline/run_feature.py --request req.json --execute  # execute"}, {"label": "Grounded summary", "desc": "Create a summary with verbatim quotations using only the selected PDF text. Claims without a located quotation are rejected.", "kind": "feature", "key": "feature:summary", "tags": [{"t": "Provider-dependent · Ollama available", "level": "plain"}, {"t": "External transmission", "level": "plain"}], "facts": [["Key", "Key required"], ["Cost", "Depends on provider"], ["External transmission", "Selected provider; Ollama stays on loopback"]], "produces": "Summary with quotations", "tech": [["Feature ID", "summary"], ["Module", "text_task"], ["Provider", "anthropic, openai, google, ollama"], ["Runtime", "python3.12, selected provider SDK or Ollama"]], "run": "# req.json = {\"schema_version\":1,\"feature\":\"summary\",\"params\":{…}}\npython pipeline/run_feature.py --request req.json            # plan\npython pipeline/run_feature.py --request req.json --execute  # execute"}, {"label": "Grounded chat", "desc": "Question and answer grounded in the PDF text, with source quotations in every ey required"], ["Cost", "Local · no cost"], ["External transmission", "None"]], "produces": "_search_index.json (BM25)", "same": [{"key": "step:search-index", "label": "Full curation › Publish › Search index"}], "tech": [["Feature ID", "keyword-search"], ["Module", "search_index"], ["Provider", "None"], ["Runtime", "python3.12"]], "run": "# req.json = {\"schema_version\":1,\"feature\":\"keyword-search\",\"params\":{…}}\npython pipeline/run_feature.py --request req.json            # plan\npython pipeline/run_feature.py --request req.json --execute  # execute"}, {"label": "Semantic search and indexing", "desc": "Build and query a hybrid index that combines Gemini embeddings and BM25 with RRF.", "kind": "feature", "key": "feature:semantic-search", "tags": [{"t": "Paid", "level": "warn"}, {"t": "External transmission", "level": "plain"}], "facts": [["Key", "Key required"], ["Cost", "Paid API"], ["External transmission", "Google embedding API"]], "produces": "_search_index.json + embeddings", "same": [{"key": "step:search-index", "label": "Full curation › Publish › Search index"}], "tech": [["Feature ID", "semantic-search"], ["Module", "search_index"], ["Provider", "google"], ["Runtime", "python3.12, google-genai"]], "run": "# req.json = {\"schema_version\":1,\"feature\":\"semantic-search\",\"params\":{…}}\npython pipeline/run_feature.py --request req.json            # plan\npython pipeline/run_feature.py --request req.json --execute  # execute"}, {"label": "Citation and bibliography metrics", "desc": "Accumulate citation history and references from Crossref, OpenAlex, and Scopus (30-day incremental by default).", "kind": "feature", "key": "feature:metrics", "tags": [{"t": "Price not set", "level": "plain"}, {"t": "External transmission", "level": "plain"}], "facts": [["Key", "No key required"], ["Cost", "External service (price not set)"], ["External transmission", "Crossref/OpenAlex/Scopus source APIs"]], "produces": "citations.md · references.md", "same": [{"key": "step:metrics", "label": "Full curation › Review › Citations and references"}], "tech": [["Feature ID", "metrics"], ["Module", "run_metrics"], ["Provider", "None"], ["Runtime", "python3.12"]], "run": "# req.json = {\"schema_version\":1,\"feature\":\"metrics\",\"params\":{…}}\npython pipeline/run_feature.py --request req.json            # plan\npython pipeline/run_feature.py --request req.json --execute  # execute"}, {"label": "Bibliography and affiliation update", "desc": "Apply papers, authors, and institution affiliations to the SQLite bibliography database. Offline is the default.", "kind": "feature", "key": "feature:bibliography-update", "tags": [{"t": "Price not set", "level": "plain"}], "facts": [["Key", "No key required"], ["Cost", "External service (price not set)"], ["External transmission", "None offline; Configured bibliography sources when online; never Zotero Web paging"]], "produces": ".cache/bibliography.sqlite3", "same": [{"key": "step:bibliography", "label": "Full curation › Publish › Bibliography database"}], "tech": [["Feature ID", "bibliography-update"], ["Module", "build_bibliography_db"], ["Provider", "None"], ["Runtime", "python3.12, bibliography runtime"]], "run": "# req.json = {\"schema_version\":1,\"feature\":\"bibliography-update\",\"params\":{…}}\npython pipeline/run_feature.py --request req.json            # plan\npython pipeline/run_feature.py --request req.json --execute  # execute"}, {"label": "Zotero remote sync", "desc": "Synchronize with Zotero's remote state. The default is report-only (dry-run); applying it can remove local entries.", "kind": "feature", "key": "feature:zotero-sync", "tags": [{"t": "Price not set", "level": "plain"}, {"t": "External transmission", "level": "plain"}, {"t": "Confirmation required", "level": "warn"}], "facts": [["Key", "Key required"], ["Cost", "External service (price not set)"], ["External transmission", "Zotero API; may remove local deleted entries when applied"]], "produces": "Synchronization report   if(e.key==="ArrowDown"&&i<vis.length-1){e.preventDefault();select(vis[i+1]);vis[i+1].el.focus();}
  else if(e.key==="ArrowUp"&&i>0){e.preventDefault();select(vis[i-1]);vis[i-1].el.focus();}
  else if(e.key==="ArrowRight"&&n.children){e.preventDefault();if(n.li.classList.contains("closed"))toggle(n.li,false);else{select(n.children[0]);n.children[0].el.focus();}}
  else if(e.key==="ArrowLeft"){e.preventDefault();if(n.children&&!n.li.classList.contains("closed")&&n.depth>0)toggle(n.li,true);else if(n.parent){select(n.parent);n.parent.el.focus();}}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();if(n.children)toggle(n.li);}});
const hash=decodeURIComponent(location.hash.slice(1));select(Object.values(byId).find(n=>n.label===hash)||TREE,{open:true,scroll:false});
</script></body></html>
