name: secret-scan

# Backstop for the local pre-push hook. Runs on every push/PR regardless of any
# per-clone git-hook state, so an Anthropic/OpenAI key can never reach master
# just because a clone never ran `bash scripts/install-hooks.sh`.
#
# Belt-and-suspenders: also enable GitHub-native push protection + secret
# scanning (repo Settings → Code security and analysis) — zero-maintenance and
# blocks the key before the push completes.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for API keys
        run: |
          # Real keys are long; the {20,} floor avoids matching docs that only
          # mention the "sk-ant-…" / "sk-proj-…" prefix format.
          PATTERN='sk-(ant|proj)-[A-Za-z0-9_-]{20,}'
          if git grep -nE "$PATTERN" -- . \
               ':(exclude).github/workflows/secret-scan.yml' \
               ':(exclude)scripts/pre-push'; then
            echo "::error::Anthropic/OpenAI API key pattern found in tracked files — remove and rotate the key."
            exit 1
          fi
          echo "✓ no API key leaks in tracked files"
