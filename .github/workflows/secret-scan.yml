name: secret-scan

# Backstop for the local pre-push hook. Runs the same raw-object scanner on
# every push/PR regardless of per-clone hook state. GitHub-native push
# protection remains the pre-receive prevention layer.

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Scan reachable raw git objects
        run: python3 scripts/scan-secrets.py --all
